services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_livo_dev
    ports:
      - "5432:5432"
    volumes:
      - app_livo_pg_data:/var/lib/postgresql/data

volumes:
  app_livo_pg_data:
